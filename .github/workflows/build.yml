name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk PodgladEkranu.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PodgladEkranu-android
          path: PodgladEkranu.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mss pillow pyinstaller
      - name: Build EXE
        working-directory: windows
        run: pyinstaller --onefile --noconsole --name PodgladSerwer PodgladSerwer.py
      - uses: actions/upload-artifact@v4
        with:
          name: PodgladEkranu-windows
          path: windows/dist/PodgladSerwer.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pliki
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src
      - run: cp src/serwer-www/podglad.php pliki/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: wersja-${{ github.run_number }}
          name: Podgląd Ekranu ${{ github.run_number }}
          make_latest: true
          body: |
            **PodgladSerwer.exe** – uruchom na Windowsie, ustaw hasło, kliknij Uruchom.
            **PodgladEkranu.apk** – zainstaluj na telefonie/tablecie (zezwól na instalację z nieznanych źródeł).
            **podglad.php** – tylko do podglądu przez internet: wgraj na swój hosting (np. 3dartgarage.pl).
          files: |
            pliki/PodgladEkranu.apk
            pliki/PodgladSerwer.exe
            pliki/podglad.php
