name: Build

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk PodgladEkranu.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PodgladEkranu-android
          path: PodgladEkranu.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mss pillow pyinstaller
      - name: Build EXE
        working-directory: windows
        run: pyinstaller --onefile --noconsole --name PodgladSerwer PodgladSerwer.py
      - uses: actions/upload-artifact@v4
        with:
          name: PodgladEkranu-windows
          path: windows/dist/PodgladSerwer.exe
