plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.artgarage.podglad'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.artgarage.podglad'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
