plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.artgarage.podglad'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.artgarage.podglad'
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        stalyKlucz {
            storeFile file('podglad.jks')
            storePassword 'podglad3dag'
            keyAlias 'podglad'
            keyPassword 'podglad3dag'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.stalyKlucz
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
